name: Build PaperTone for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK on the build runner
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained single-file app
        run: >-
          dotnet publish .\PaperTone\PaperTone.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output .\artifacts\PaperTone-win-x64

      - name: Upload PaperTone executable
        uses: actions/upload-artifact@v4
        with:
          name: PaperTone-win-x64
          path: artifacts/PaperTone-win-x64/PaperTone.exe
          if-no-files-found: error
          retention-days: 30
